# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Lily58 OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# CONFIG_NICE_VIEW_GEM_ANIMATION_MS=1920
CONFIG_NICE_VIEW_GEM_ANIMATION=n

# nice-view-gem (vendored in boards/shields/nice_view_gem)
CONFIG_NICE_VIEW_GEM_PROFILE_COUNT=2
CONFIG_NICE_VIEW_GEM_OS_LAYER=3
# Linux-mode state central -> peripheral rides on the HID indicator forwarding
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
